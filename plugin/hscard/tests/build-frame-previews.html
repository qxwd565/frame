<!doctype html><meta charset="utf-8">
<meta name="hscard-resource-base" content="http://127.0.0.1:19420/resources/">
<canvas></canvas><script type="module">
// Build-time snapshots of the actual loading-card renderer, never texture atlases.
import {HSPlusSources} from '/plugin/assets/unity/hsplus-sources.mjs';
import {FrameComposer} from '/plugin/assets/unity/frame-composition.mjs';
import {NativeDrawBuilder} from '/plugin/assets/unity/native-draw-builder.mjs';
import {WebGPUNativeRenderer} from '/plugin/assets/unity/webgpu-native.mjs';
import {WebGPUCardRenderer} from '/plugin/assets/unity/webgpu-card-renderer.mjs';
import {historicalSelection} from '/plugin/assets/unity/historical-adapter.mjs';
import {loadShaderIndex} from '/plugin/assets/unity/wgsl-programs.mjs';
window.result={running:true};
try {
 const bytes=async n=>new Uint8Array(await(await fetch('/resources/'+n)).arrayBuffer());
 const json=async n=>new Response(new Blob([await bytes(n)]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
 const [frames,settings,portraits,fits,watermarks,library]=await Promise.all([bytes('frames-constructed.json.gz'),bytes('text-settings.json.gz'),json('portrait-meshes.json.gz'),json('frame-fits.json.gz'),json('watermarks.json.gz'),json('shader-library.json.gz')]);
 const sources=await HSPlusSources.load(frames,settings),composer=new FrameComposer(sources,portraits,fits,library,watermarks);
 const builder=new NativeDrawBuilder(library,sources.frames.pipelineKeywords,t=>t.pixels||sources.texture(t.key));
 const renderer=await WebGPUNativeRenderer.create(document.querySelector('canvas'),await loadShaderIndex(),sources);
 const cards=new WebGPUCardRenderer({sources,composer,builder,renderer});
 const errors=[];renderer.device.addEventListener('uncapturederror',e=>errors.push(e.error.message));
 // Derive interval boundaries from the same selector the real renderer uses.
 // This build tool does not maintain a second list of frame release dates.
 const dates=[...new Set([...historicalSelection.toString().matchAll(/'(\d{4}-\d{2}-\d{2})'/g)].map(m=>m[1]))].sort();
 const classes=['NEUTRAL','DEATHKNIGHT','DEMONHUNTER','DRUID','HUNTER','MAGE','PALADIN','PRIEST','ROGUE','SHAMAN','WARLOCK','WARRIOR'];
 const rarities=['FREE','COMMON','RARE','EPIC','LEGENDARY'];
 const jobs=[],entries={};
 for(const kind of ['MINION','SPELL','WEAPON','HERO','LOCATION'])for(const cardClass of classes)for(const rarity of rarities){
  const variations=kind==='MINION'?[0,1,2]:['SPELL','HERO'].includes(kind)?[0,1]:[0];
  for(const variant of variations){
   const key=[kind,cardClass,rarity,variant].join(':'),card={kind,cardClass,rarity,loading:true,golden:false,quantity:1,frameProfile:'current',renderDate:'',race:kind==='MINION'?['','야수','야수,악마'][variant]:'',school:kind==='SPELL'&&variant?'비전':'',armor:kind==='HERO'&&variant?1:0,attack:kind==='MINION'||kind==='WEAPON'?1:0,tags:{},artPixels:{width:1,height:1,format:28,levels:[new Uint8Array([128,128,128,255])]}};
   const row={current:null,history:[]};entries[key]=row;const rendered=new Map();
   for(const date of ['',...dates]){
    const value={...card,frameProfile:date?'historical':'current',renderDate:date};
    const {textProfile,edition,...selection}=date?(historicalSelection(value)||{}):{};
    const signature=JSON.stringify(selection);
    let job=rendered.get(signature);
    if(!job){job={card:value,refs:[]};rendered.set(signature,job);jobs.push(job);}
    if(!date)job.refs.push({key,current:true});
    else if(row.history.at(-1)?.signature!==signature){row.history.push({from:date,signature});job.refs.push({key,index:row.history.length-1});}
   }
  }
 }
 window.previewManifest={schema:1,width:256,height:400,entries};
 window.previewJobs=jobs.length;
 window.renderPreview=async index=>{
  const {card,refs}=jobs[index];let prepared;
  try{prepared=await cards.prepare(card);}catch(error){
   // Historical packages cannot contain classes introduced after that package.
   // They are not valid dated cards; keep the ordinary initial preview for them.
   if(card.frameProfile==='historical'&&/^Historical class unavailable /.test(error.message))return {refs,unavailable:true,card:{kind:card.kind,cardClass:card.cardClass,renderDate:card.renderDate}};
   throw error;
  }
  const target=renderer.createTarget(prepared.context.width,prepared.context.height);
  let buffer;
  try{
   await cards.renderPrepared(prepared,{transparent:true,time:0,destination:target});
   const stride=Math.ceil(target.width*4/256)*256;
   buffer=renderer.device.createBuffer({size:stride*target.height,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
   const encoder=renderer.device.createCommandEncoder();encoder.copyTextureToBuffer({texture:target.texture},{buffer,bytesPerRow:stride},{width:target.width,height:target.height});renderer.device.queue.submit([encoder.finish()]);
   await buffer.mapAsync(GPUMapMode.READ);const raw=new Uint8Array(buffer.getMappedRange()),pixels=new Uint8ClampedArray(target.width*target.height*4);
   for(let y=0;y<target.height;y++)pixels.set(raw.subarray(y*stride,y*stride+target.width*4),y*target.width*4);
   const original=document.createElement('canvas');original.width=target.width;original.height=target.height;original.getContext('2d').putImageData(new ImageData(pixels,target.width,target.height),0,0);
   const small=document.createElement('canvas');small.width=256;small.height=400;small.getContext('2d').drawImage(original,0,0,256,400);
   const data=small.toDataURL('image/webp',.86).split(',')[1];
   if(errors.length)throw Error(errors.join('\n'));
   return {data,refs,card:{kind:card.kind,cardClass:card.cardClass,rarity:card.rarity,renderDate:card.renderDate}};
  }finally{buffer?.destroy();renderer.releaseTarget(target);cards.releasePrepared(prepared);}
 };
 window.result={running:false,jobs:jobs.length,entries:Object.keys(entries).length,dates};
}catch(error){window.result={running:false,error:error.stack};}
</script>
