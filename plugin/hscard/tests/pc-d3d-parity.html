<!doctype html><meta charset="utf-8"><meta name="hscard-resource-base" content="http://127.0.0.1:19420/resources/"><canvas></canvas>
<script type="module">
import {resourceURL,resourceFetch} from '/plugin/assets/unity/resource-url.mjs';
import {HSPlusSources} from '/plugin/assets/unity/hsplus-sources.mjs';
import {FrameComposer} from '/plugin/assets/unity/frame-composition.mjs';
import {NativeDrawBuilder} from '/plugin/assets/unity/native-draw-builder.mjs';
import {WebGPUNativeRenderer} from '/plugin/assets/unity/webgpu-native.mjs';
import {WebGPUCardRenderer} from '/plugin/assets/unity/webgpu-card-renderer.mjs';
import {createFontRasterizer} from '/plugin/assets/unity/font-raster.mjs';
import {loadShaderIndex} from '/plugin/assets/unity/wgsl-programs.mjs';
if(new URLSearchParams(location.search).get('source')==='api')document.querySelector('meta[name="hscard-resource-base"]').content='https://raw.githubusercontent.com/qxwd565/legacy/main/frame/';
const bytes=async n=>new Uint8Array(await(await resourceFetch(resourceURL(n))).arrayBuffer());
const json=async n=>new Response(new Blob([await bytes(n)]).stream().pipeThrough(new DecompressionStream('gzip'))).json();
const [frames,settings,portraits,fits,watermarks,library,names,fonts,wasm]=await Promise.all([bytes('frames-constructed.json.gz'),bytes('text-settings.json.gz'),json('portrait-meshes.json.gz'),json('frame-fits.json.gz'),json('watermarks.json.gz'),json('shader-library.json.gz'),json('name-meshes.json.gz'),bytes('original-fonts.json.gz'),bytes('freetype-bridge.wasm')]);
const sources=await HSPlusSources.load(frames,settings),composer=new FrameComposer(sources,portraits,fits,library,watermarks),raster=await createFontRasterizer(wasm,fonts,sources.text.fonts);
const builder=new NativeDrawBuilder(library,sources.frames.pipelineKeywords,async t=>{if(t.pixels)return t.pixels;if(t.key)return sources.texture(t.key);const w=watermarks.entries[t.embedded];if(!w)throw Error('Unexpected texture source');return{width:w.width,height:w.height,format:28,levels:[Uint8Array.from(atob(w.data),c=>c.charCodeAt(0))]};});
const renderer=await WebGPUNativeRenderer.create(document.querySelector('canvas'),await loadShaderIndex(),sources),cards=new WebGPUCardRenderer({sources,composer,builder,renderer,raster,nameMeshes:names});
// Diagnostic only: compare explicit fused multiply-add with the untranslated
// D3D MAD instruction. Never alter production programs through this hook.
const diagnosticModule=renderer.module.bind(renderer);
renderer.module=id=>{
 if((window.useFmaDiagnostic||window.useImplicitSampleDiagnostic||window.usePortraitMadDiagnostic)&&renderer.extraPrograms?.has(id)){
  const program=renderer.extraPrograms.get(id);
  if(!program.fmaDiagnostic){
   let wgsl=program.wgsl;
   if(window.useFmaDiagnostic&&(!window.fmaStageDiagnostic||program.stage===window.fmaStageDiagnostic))wgsl=wgsl.replace(/\(\((_e\d+(?:\.[xyzw]+)?) \* (_e\d+(?:\.[xyzw]+)?)\) \+ (_e\d+(?:\.[xyzw]+)?)\)/g,'fma($1, $2, $3)');
   if(window.useImplicitSampleDiagnostic)wgsl=wgsl.replace(/textureSampleBias\(([^,]+),\s*([^,]+),\s*([^,]+),\s*_e\d+\.x\)/g,'textureSample($1, $2, $3)');
   if(window.usePortraitMadDiagnostic&&id==='fbd446513ec709b812b14c058f9b2e9bacc4fe54d275b50e6ca0600595e0eb86'){
    const before=wgsl;
    wgsl=wgsl.replace('((_e53.xyz * _e55.xyz) + -(_e58.xyz))','fma(_e53.xyz, _e55.xyz, -_e58.xyz)')
             .replace('((_e70.www * _e72.xyz) + _e75.xyz)','fma(_e70.www, _e72.xyz, _e75.xyz)');
    if(before===wgsl)throw Error('Portrait MAD diagnostic source changed');
   }
   renderer.extraPrograms.set(id,{...program,wgsl,fmaDiagnostic:true});
  }
 }
 return diagnosticModule(id);
};
// Optional GPU-only sampler bias override for diagnosing D3D/WebGPU parity.
// The captured original D3D draw commands retain their authored sampler state.
const originalBindGroup=renderer._bindGroup.bind(renderer);
renderer._bindGroup=(pipeline,stage,draw)=>{
 if(stage==='fragment'&&Number.isFinite(window.diagnosticMipBias))draw={...draw,fragmentTextures:draw.fragmentTextures.map(t=>({...t,texture:{...t.texture,sampler:{...t.texture.sampler,bias:window.diagnosticMipBias}}}))};
 return originalBindGroup(pipeline,stage,draw);
};
window.enableOriginalMipDiagnostic=async(forceSoftware=false)=>{
 const adapterSource=await(await fetch('/plugin/assets/unity/historical-adapter.mjs')).text();
 const match=/native-minion-profile\.mjs\?ver=[A-Za-z0-9-]+/.exec(adapterSource);if(!match)throw Error('Native profile module revision missing');
 const {NativeMinionProfile}=await import('/plugin/assets/unity/'+match[0]);
 const response=await fetch('/resources/historical-frames/early-native/minion-mip-bindings.json.gz');
 if(!response.ok)throw Error('Original source mip bindings unavailable');
 const bindings=await new Response(response.body.pipeThrough(new DecompressionStream('gzip'))).json(),load=NativeMinionProfile.load;
 NativeMinionProfile.load=async function(...args){const profile=await load.apply(this,args),selected=bindings.bindings[profile.data.version];if(!selected)throw Error('Original diagnostic source version missing');
  for(const item of profile.catalog.textures){const original=bindings.textures[selected[item.id]];if(!original)throw Error('Original diagnostic texture missing: '+item.id);Object.assign(item,original);}
  return profile;
 };
 if(forceSoftware)renderer.bc=false;
};
const b64=data=>{let s='';for(let i=0;i<data.length;i+=0x8000)s+=String.fromCharCode(...data.subarray(i,i+0x8000));return btoa(s);};
const le=(n)=>{const x=new Uint8Array(4);new DataView(x.buffer).setInt32(0,n,true);return x;};
const concat=parts=>{const out=new Uint8Array(parts.reduce((n,p)=>n+p.length,0));let at=0;for(const p of parts){out.set(p,at);at+=p.length;}return out;};
const hash=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),b=>b.toString(16).padStart(2,'0')).join('');
window.capture=async(date,golden,cardClass='MAGE',onlyDraw=null,kind='MINION')=>{
 const card={kind,cardClass,golden,name:'동일한 카드',text:'전투의 함성: 카드를 뽑습니다.',race:kind==='MINION'?'멀록':'',cost:3,attack:2,health:4,durability:2,rarity:'RARE',set:'EXPERT1',watermark:'Set1_Icon',quantity:1,frameProfile:'historical',renderDate:date,tags:{},artPixels:{width:1,height:1,format:28,levels:[new Uint8Array([80,130,190,255])]}};
 const prepared=await cards.prepare(card),target=renderer.createTarget(prepared.context.width,prepared.context.height);
 try{
  const groups=await Promise.all(prepared.frame.parts.map(part=>builder.draw(part,{...prepared.context,time:0})));
  const drawSources=groups.flatMap((group,i)=>group.map(()=>({path:prepared.frame.parts[i].path,slot:prepared.frame.parts[i].slot,shader:prepared.frame.parts[i].material.shader})));
  const allDraws=groups.flat();
  const draws=onlyDraw===null?allDraws:[allDraws[onlyDraw]];if(draws.some(x=>!x))throw Error('Invalid diagnostic draw');
  await renderer.transparent(target.width,target.height,draws,target);await renderer.device.queue.onSubmittedWorkDone();
  const pitch=Math.ceil(target.width*4/256)*256,buffer=renderer.device.createBuffer({size:pitch*target.height,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ}),encoder=renderer.device.createCommandEncoder();
  encoder.copyTextureToBuffer({texture:target.texture},{buffer,bytesPerRow:pitch},{width:target.width,height:target.height});renderer.device.queue.submit([encoder.finish()]);await buffer.mapAsync(GPUMapMode.READ);
  const input=new Uint8Array(buffer.getMappedRange()),pixels=new Uint8Array(target.width*target.height*4);for(let y=0;y<target.height;y++)pixels.set(input.subarray(y*pitch,y*pitch+target.width*4),y*target.width*4);buffer.unmap();buffer.destroy();
  const resources={};
  async function put(data){const id=await hash(data);resources[id]??=b64(data);return id;}
  async function mesh(m){
   if(!m.attributes||!m.indices)throw Error('Original decoded mesh required');
   const parts=[le(0x314d5048),le(m.count),le(m.attributes.size)];
   for(const [name,values] of m.attributes){const label=new TextEncoder().encode(name);parts.push(new Uint8Array([label.length]),label,le(values.length),new Uint8Array(values.buffer,values.byteOffset,values.byteLength));}
   parts.push(le(m.indices.length),new Uint8Array(m.indices.buffer,m.indices.byteOffset,m.indices.byteLength));return put(concat(parts));
  }
  async function texture(entry){
   const t=entry.texture,p=t.pixels;if(![28,71,77].includes(p.format)||!p.levels.length||p.levels.some(x=>!x))throw Error('Unsupported reference texture format');
   const data=concat([le(0x31545048),le(p.width),le(p.height),le(p.format),le(p.levels.length),...p.levels.flatMap(level=>[le(level.length),level])]),s=t.sampler||{};
   return {slot:entry.slot,sampler:entry.sampler,resource:await put(data),srgb:!!entry.srgb,settings:{filter:s.filter??1,wrapU:s.wrapU??1,wrapV:s.wrapV??1,wrapW:s.wrapW??1,anisotropy:Math.max(1,s.anisotropy||1),bias:s.bias||0}};
  }
  const result=[];
  for(const draw of draws)result.push({mesh:await mesh(draw.mesh),vertexProgram:draw.vertexProgram,fragmentProgram:draw.fragmentProgram,
   subshader:0,pass:0,keywords:[],vertexBuffers:draw.vertexBuffers.map(x=>({slot:x.slot,data:b64(x.data)})),fragmentBuffers:draw.fragmentBuffers.map(x=>({slot:x.slot,data:b64(x.data)})),
   vertexTextures:await Promise.all(draw.vertexTextures.map(texture)),fragmentTextures:await Promise.all(draw.fragmentTextures.map(texture)),state:draw.state});
  return {version:prepared.frame.nativeVersion,width:target.width,height:target.height,anisotropicFiltering:sources.frames.pipelineAnisotropy??1,totalDraws:allDraws.length,drawSources:onlyDraw===null?drawSources:[drawSources[onlyDraw]],webgpuPixels:b64(pixels),draws:result,resources};
 }finally{renderer.releaseTarget(target);cards.releasePrepared(prepared);}
};
window.verifyHeroPower=async()=>{
 const card={kind:'HERO_POWER',cardClass:'MAGE',golden:false,loading:true,cost:2,rarity:'FREE',quantity:1,frameProfile:'historical',renderDate:'2013-08-17',tags:{}};
 const prepared=await cards.prepare(card),target=renderer.createTarget(prepared.context.width,prepared.context.height);
 try{await cards.renderPrepared(prepared,{transparent:true,destination:target,time:0});await renderer.device.queue.onSubmittedWorkDone();return{version:prepared.frame.nativeVersion,parts:prepared.frame.parts.length};}
 finally{renderer.releaseTarget(target);cards.releasePrepared(prepared);}
};window.ready=true;
</script>
