<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<!-- Simulate an older WordPress concatenated stylesheet during replacement. -->
<style>@media(min-width:821px){.hscard-deck-list--v2 .hscard-deck-cards > .hscard-deck-card:nth-child(5n + 1) > .hscard-card-surface{transform:translateX(-7.5%)}.hscard-deck-list--v2 .hscard-deck-cards > .hscard-deck-card:nth-child(5n) > .hscard-card-surface{transform:translateX(10.4%)}}</style>
<link rel="stylesheet" href="/plugin/assets/unity/deck-cards.css">
<style>body{margin:24px;background:white}main{max-width:1100px;margin:auto}ol{padding:0;margin:0;list-style:none}figure{margin:0}</style>
<main class="hscard-deck-list hscard-deck-list--v2"><div class="hscard-deck-layout--v2"><div class="hscard-deck-body"><ol class="hscard-deck-cards hscard-deck-column"></ol></div></div></main>
<script type="module">
window.result={running:true};
try{
 const manifest=await(await fetch('/plugin/assets/unity/frame-previews/index.json')).json();
 const cases=[
  ['SPELL','ROGUE','FREE',0,'2013-08-17'],['SPELL','ROGUE','RARE',0,'2013-08-17'],['MINION','NEUTRAL','LEGENDARY',0,'2013-08-17'],['MINION','ROGUE','EPIC',1,'2013-10-03'],
  ['MINION','NEUTRAL','COMMON',0,'2013-08-17'],['WEAPON','ROGUE','RARE',0,'2013-10-03'],['SPELL','DRUID','EPIC',0,'2020-10-23'],['SPELL','PRIEST','EPIC',0,'2020-10-23'],
  ['MINION','WARLOCK','LEGENDARY',1,''],['SPELL','MAGE','LEGENDARY',1,''],['WEAPON','DEATHKNIGHT','EPIC',0,''],['LOCATION','NEUTRAL','RARE',0,'']];
 const list=document.querySelector('ol');
 for(const [kind,cls,rarity,variant,date] of cases){const row=manifest.entries[[kind,cls,rarity,variant].join(':')];let file=row.current;if(date)for(const interval of row.history){if(interval.from>date)break;file=interval.file;}
  const li=document.createElement('li');li.className='hscard-deck-card has-card-surface';li.innerHTML=`<figure class="hscard-card-surface" data-hscard-frame-kind="${kind}" data-hscard-frame-rarity="${rarity}"><div class="hscard-card-placeholder" style="aspect-ratio:436/682"><img class="hscard-frame-preview" src="/resources/frame-previews/${file}" width="256" height="400" alt=""></div></figure>`;list.append(li);
 }
 await Promise.all([...document.images].map(img=>img.decode()));
 const boxes=[...list.children].map(el=>el.getBoundingClientRect()),first=boxes.filter(b=>Math.abs(b.top-boxes[0].top)<1).length;
 const desktop=innerWidth>=821;
 if(desktop&&(first!==4||boxes[4].top<=boxes[0].top))throw Error('Expected four cards per row');
 if(desktop){const frames=[...list.querySelectorAll('.hscard-card-surface')].map(el=>el.getBoundingClientRect());for(let i=0;i<frames.length;i++)for(let j=i+1;j<frames.length;j++){const a=frames[i],b=frames[j];if(a.left<b.right&&b.left<a.right&&a.top<b.bottom&&b.top<a.bottom)throw Error('Old edge alignment overlaps card viewports');}}
 if(document.documentElement.scrollWidth>innerWidth)throw Error('Horizontal overflow');
 window.result={running:false,viewport:innerWidth,desktop,columns:first,images:document.images.length,complete:[...document.images].every(x=>x.naturalWidth===256),overflow:document.documentElement.scrollWidth>innerWidth};
}catch(error){window.result={running:false,error:error.stack};}
</script>
